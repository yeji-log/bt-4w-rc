<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>블루투스 RC카 컨트롤러</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- 상단 공통 연결 바: 탭이 바뀌어도 항상 노출 -->
    <header id="connection-bar">
      <div id="connection-status">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">연결 안 됨</span>
      </div>
      <div id="connection-actions">
        <button id="rescan-btn" type="button" title="장치 다시 검색" aria-label="장치 다시 검색">⟳</button>
        <button id="connect-btn" type="button">연결하기</button>
      </div>
    </header>

    <!-- 탭 전환 -->
    <nav id="tab-bar">
      <button class="tab-btn active" data-tab="terminal-tab" type="button">터미널</button>
      <button class="tab-btn" data-tab="gamepad-tab" type="button">게임패드</button>
    </nav>

    <main id="tab-content">
      <!-- 터미널 탭 -->
      <section id="terminal-tab" class="tab-panel active">
        <div id="terminal-log" class="terminal-log"></div>
        <div class="terminal-input-row">
          <input id="terminal-input" type="text" placeholder="보낼 명령을 입력하세요 (예: F)" disabled />
          <button id="terminal-send" type="button" disabled>전송</button>
        </div>
        <div class="terminal-options-row">
          <label>
            <input id="terminal-newline-toggle" type="checkbox" checked />
            전송 시 개행(\n) 추가
          </label>
          <button id="terminal-clear" type="button">로그 지우기</button>
        </div>
      </section>

      <!-- 게임패드 탭 -->
      <section id="gamepad-tab" class="tab-panel">
        <div class="gamepad-toolbar">
          <button id="gamepad-settings-btn" type="button" title="게임패드 설정" aria-label="게임패드 설정">⚙️</button>
        </div>

        <div class="gamepad-layout">
          <div class="dpad">
            <button class="pad-btn pad-up" data-key="up" type="button">
              <span class="pad-btn-icon">▲</span>
              <span class="pad-btn-value"></span>
            </button>
            <button class="pad-btn pad-left" data-key="left" type="button">
              <span class="pad-btn-icon">◀</span>
              <span class="pad-btn-value"></span>
            </button>
            <button class="pad-btn pad-stop" data-key="stop" type="button">
              <span class="pad-btn-icon">■</span>
              <span class="pad-btn-value"></span>
            </button>
            <button class="pad-btn pad-right" data-key="right" type="button">
              <span class="pad-btn-icon">▶</span>
              <span class="pad-btn-value"></span>
            </button>
            <button class="pad-btn pad-down" data-key="down" type="button">
              <span class="pad-btn-icon">▼</span>
              <span class="pad-btn-value"></span>
            </button>
          </div>

          <div class="action-pad">
            <button class="pad-btn pad-action" data-key="action1" type="button">
              <span class="pad-btn-icon">A</span>
              <span class="pad-btn-value"></span>
            </button>
            <button class="pad-btn pad-action" data-key="action2" type="button">
              <span class="pad-btn-icon">B</span>
              <span class="pad-btn-value"></span>
            </button>
          </div>
        </div>

        <p class="gamepad-hint">
          ⚙️ 을 누르면 버튼 값을 바꿀 수 있어요. 가로로 돌리면 더 편하게 조작할 수 있어요.
        </p>
      </section>
    </main>

    <!-- 게임패드 설정 패널: 버튼 값 목록 편집 + 기본값 초기화를 한 화면에서 -->
    <div id="gamepad-settings-modal" class="modal">
      <div class="modal-card">
        <h2>⚙️ 게임패드 설정</h2>
        <div id="gamepad-settings-list" class="settings-list"></div>
        <div class="modal-actions modal-actions-split">
          <button id="gamepad-settings-reset" type="button" class="btn-subtle">기본값으로 초기화</button>
          <button id="gamepad-settings-close" type="button">닫기</button>
        </div>
      </div>
    </div>

    <!-- 범용 확인(확인/취소) 모달. 브라우저 기본 confirm()은 앱마다 버튼 라벨이
         제멋대로 나오는 경우가 있어 직접 만든 모달로 대체 -->
    <div id="confirm-modal" class="modal">
      <div class="modal-card">
        <p id="confirm-modal-message"></p>
        <div class="modal-actions">
          <button id="confirm-modal-cancel" type="button">취소</button>
          <button id="confirm-modal-ok" type="button">확인</button>
        </div>
      </div>
    </div>

    <!-- 비차단 알림 (연결 실패 등). alert()와 달리 화면을 가로막지 않고
         터미널/게임패드 탭이 계속 보이는 상태에서 잠깐 표시됐다가 사라짐 -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="ble.js"></script>
  <script src="storage.js"></script>
  <script src="terminal.js"></script>
  <script src="gamepad.js"></script>
  <script src="app.js"></script>
</body>
</html>
